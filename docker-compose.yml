version: '3.8'

services:
  database:
    image: postgres:16.3
    container_name: postgres-database
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: bobahan
      POSTGRES_PASSWORD: pass
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data: