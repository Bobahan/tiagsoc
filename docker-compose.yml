version: "3.8"

services:
  database:
    image: postgres:16.3
    container_name: postgres-database
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: bobahan
      POSTGRES_PASSWORD: pass
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:latest
    restart: always
    container_name: redis-database
    environment:
      - name=value
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  db-data:
  redis_data:
